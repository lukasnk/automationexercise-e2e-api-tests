name: Run UI tests
description: Install Java, Playwright, and run the Maven UI suite

runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Install Playwright browsers
      shell: bash
      run: mvn -B exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

    - name: Run Maven tests
      shell: bash
      run: mvn -B clean test -Dheadless=true
